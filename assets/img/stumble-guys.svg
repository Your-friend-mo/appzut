<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgSg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3443"/>
      <stop offset="100%" stop-color="#34e89e"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79"/>
      <stop offset="100%" stop-color="#f1b814"/>
    </linearGradient>
    <filter id="sgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#34e89e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bgSg)"/>
  <rect x="2" y="2" width="196" height="196" rx="40" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- Stumble Guy Character Face & Crown -->
  <g filter="url(#sgGlow)" transform="translate(100, 105)">
    <!-- Face -->
    <ellipse cx="0" cy="10" rx="48" ry="44" fill="#ffd1a4"/>
    <!-- Big Anime Eyes -->
    <ellipse cx="-18" cy="8" rx="8" ry="12" fill="#1b2333"/>
    <ellipse cx="18" cy="8" rx="8" ry="12" fill="#1b2333"/>
    <circle cx="-16" cy="4" r="3.5" fill="#ffffff"/>
    <circle cx="20" cy="4" r="3.5" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M -12 26 Q 0 38 12 26" fill="none" stroke="#1b2333" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-28" cy="22" rx="6" ry="4" fill="#ff9999" opacity="0.6"/>
    <ellipse cx="28" cy="22" rx="6" ry="4" fill="#ff9999" opacity="0.6"/>

    <!-- Backward Cap / Crown -->
    <path d="M -44 -12 C -44 -40 44 -40 44 -12 C 44 -5 32 0 0 0 C -32 0 -44 -5 -44 -12 Z" fill="url(#capGrad)"/>
    <path d="M 32 -10 Q 56 -12 58 -2 C 58 5 40 4 32 -2 Z" fill="#e02424"/>
    
    <!-- Champion Crown on Cap -->
    <polygon points="-22,-36 -12,-28 0,-44 12,-28 22,-36 18,-20 -18,-20" fill="url(#crownGrad)"/>
    <circle cx="0" cy="-44" r="2.5" fill="#fff"/>
    <circle cx="-22" cy="-36" r="2" fill="#fff"/>
    <circle cx="22" cy="-36" r="2" fill="#fff"/>
  </g>
</svg>