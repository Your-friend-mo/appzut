<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgClash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2c44"/>
      <stop offset="100%" stop-color="#0c121e"/>
    </linearGradient>
    <linearGradient id="helmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833"/>
      <stop offset="50%" stop-color="#d4820a"/>
      <stop offset="100%" stop-color="#8c4e00"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d5dbe5"/>
    </linearGradient>
    <filter id="clashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d4820a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bgClash)"/>
  <rect x="2" y="2" width="196" height="196" rx="40" fill="none" stroke="rgba(255,184,51,0.25)" stroke-width="2"/>
  
  <!-- Clash of Clans Barbarian Helmet & Swords -->
  <g filter="url(#clashGlow)" transform="translate(20, 20)">
    <!-- Horn Left -->
    <path d="M 40 70 C 15 50 15 20 28 12 C 34 26 50 48 60 62 Z" fill="url(#hornGrad)"/>
    <!-- Horn Right -->
    <path d="M 120 70 C 145 50 145 20 132 12 C 126 26 110 48 100 62 Z" fill="url(#hornGrad)"/>
    <!-- Helmet Dome -->
    <path d="M 42 75 C 42 35 118 35 118 75 L 122 110 C 122 115 116 118 110 118 L 50 118 C 44 118 38 115 38 110 Z" fill="url(#helmGrad)"/>
    <!-- Face visor & mustache -->
    <rect x="52" y="76" width="56" height="18" rx="4" fill="#1b2333"/>
    <circle cx="66" cy="85" r="4" fill="#ffffff"/>
    <circle cx="94" cy="85" r="4" fill="#ffffff"/>
    <!-- Barbarian Yellow Mustache -->
    <path d="M 40 102 C 60 98 75 112 80 112 C 85 112 100 98 120 102 C 128 118 108 132 80 126 C 52 132 32 118 40 102 Z" fill="#ffb833"/>
    <!-- Rivets -->
    <circle cx="50" cy="58" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="80" cy="46" r="3.5" fill="#fff" opacity="0.8"/>
    <circle cx="110" cy="58" r="3" fill="#fff" opacity="0.8"/>
  </g>
</svg>