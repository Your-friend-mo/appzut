<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgRoblox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#e02424"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#ff3b30" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bgRoblox)"/>
  <rect x="2" y="2" width="196" height="196" rx="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <g transform="translate(100, 100) rotate(-15) translate(-100, -100)" filter="url(#shadow)">
    <!-- Main Outer Tilted Cube -->
    <rect x="48" y="48" width="104" height="104" rx="20" fill="url(#cubeGrad)"/>
    <rect x="48" y="48" width="104" height="104" rx="20" fill="url(#glowGrad)"/>
    <!-- Inner Cutout -->
    <rect x="82" y="82" width="36" height="36" rx="8" fill="#0a0d14"/>
  </g>
  <circle cx="155" cy="45" r="14" fill="#c8f169"/>
  <path d="M151 45 L154 48 L160 41" fill="none" stroke="#0a0d14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>