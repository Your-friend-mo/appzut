<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgBrawl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1548"/>
      <stop offset="100%" stop-color="#110820"/>
    </linearGradient>
    <linearGradient id="skullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="brawlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ffcc00" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bgBrawl)"/>
  <rect x="2" y="2" width="196" height="196" rx="40" fill="none" stroke="rgba(255,204,0,0.2)" stroke-width="2"/>
  
  <!-- Brawl Stars Skull -->
  <g filter="url(#brawlGlow)" transform="translate(25, 25)">
    <!-- Skull Base -->
    <path d="M 75 10 C 35 10 15 40 15 78 C 15 105 32 120 45 128 L 45 138 C 45 142 50 146 55 146 L 95 146 C 100 146 105 142 105 138 L 105 128 C 118 120 135 105 135 78 C 135 40 115 10 75 10 Z" fill="url(#skullGrad)"/>
    <!-- Left Star Eye -->
    <polygon points="48,60 52,70 62,71 54,78 57,88 48,82 39,88 42,78 34,71 44,70" fill="#1b0e2b"/>
    <!-- Right Star Eye -->
    <polygon points="102,60 106,70 116,71 108,78 111,88 102,82 93,88 96,78 88,71 98,70" fill="#1b0e2b"/>
    <!-- Nose -->
    <polygon points="75,90 70,102 80,102" fill="#1b0e2b"/>
    <!-- Teeth -->
    <rect x="58" y="126" width="8" height="12" rx="3" fill="#1b0e2b"/>
    <rect x="71" y="126" width="8" height="12" rx="3" fill="#1b0e2b"/>
    <rect x="84" y="126" width="8" height="12" rx="3" fill="#1b0e2b"/>
  </g>
</svg>