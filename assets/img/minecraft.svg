<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142419"/>
      <stop offset="100%" stop-color="#08100a"/>
    </linearGradient>
    <filter id="mcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4caf50" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bgMc)"/>
  <rect x="2" y="2" width="196" height="196" rx="40" fill="none" stroke="rgba(76,175,80,0.25)" stroke-width="2"/>
  
  <!-- Isometric Grass Block -->
  <g filter="url(#mcGlow)" transform="translate(100, 48)">
    <!-- Top Face (Green Grass) -->
    <polygon points="0,0 56,32 0,64 -56,32" fill="#5cb85c"/>
    <polygon points="-28,16 0,32 28,16 0,0" fill="#6ec76e"/>
    <polygon points="10,22 28,32 14,40 -4,30" fill="#4ea64e"/>

    <!-- Left Face (Dirt + Grass Fringe) -->
    <polygon points="-56,32 0,64 0,116 -56,84" fill="#795548"/>
    <!-- Left Grass Overhang -->
    <polygon points="-56,32 0,64 0,78 -12,72 -18,80 -32,72 -42,80 -56,70" fill="#4caf50"/>
    <polygon points="-44,80 -38,80 -38,88 -44,88" fill="#4caf50"/>
    <polygon points="-16,80 -10,80 -10,88 -16,88" fill="#4caf50"/>

    <!-- Right Face (Darker Dirt + Grass Fringe) -->
    <polygon points="0,64 56,32 56,84 0,116" fill="#5d4037"/>
    <!-- Right Grass Overhang -->
    <polygon points="0,64 56,32 56,70 44,78 36,72 24,82 12,74 0,78" fill="#388e3c"/>
    <polygon points="34,80 40,80 40,88 34,88" fill="#388e3c"/>
    <polygon points="12,82 18,82 18,90 12,90" fill="#388e3c"/>
  </g>
</svg>