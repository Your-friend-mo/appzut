<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d17">
  <title>Search Catalog &amp; Mods · AppZut</title>
  <meta name="description" content="Search the AppZut library for verified mobile mods, emulators, executors, and patched apps. Instant results with typo-tolerant search across iOS and Android.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/img/forgekit-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="search-page">
  <main class="wrap main">
    <section class="search-screen">
      <div class="search-screen-head">
        <h1>Search library</h1>
        <a href="index.html" aria-label="Close search">×</a>
      </div>

      <div class="search-filters" role="tablist" aria-label="Filter by category">
        <a class="active" href="search.html" data-search-filter="all">All</a>
        <a href="search.html?category=apps" data-search-filter="apps">Apps</a>
        <a href="search.html?category=games" data-search-filter="games">Games</a>
      </div>

      <form class="search-screen-form" action="search.html" method="get" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search-input" type="search" name="q" placeholder="Search apps, games, mods..." autocomplete="off" autofocus>
        <a id="search-clear" href="#" aria-label="Clear search">×</a>
      </form>

      <div class="search-results">
        <p class="search-count" id="search-count"></p>
        <div class="search-result-list" id="search-result-list"></div>
      </div>
    </section>
  </main>

  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
